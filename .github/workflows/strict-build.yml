name: "Strict Build"

on:
  pull_request: {}

permissions:
  contents: read

# Cancel in-progress runs for the same PR when new commits are pushed.
concurrency:
  group: "strict-build-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  strict-build:
    name: Build with warnings as errors
    runs-on: WikiBuilder
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31.10.4
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Run strict Sphinx build
        run: nix-shell --run "make strict"
